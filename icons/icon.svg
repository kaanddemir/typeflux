<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Cyan Gradient: Radial (center light, edges darker) -->
    <radialGradient id="cyanGradient" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </radialGradient>

    <!-- Subtle Drop Shadow for Logo/Letters -->
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background (perfect square as per extension guidelines) -->
  <rect x="0" y="0" width="128" height="128" fill="url(#cyanGradient)" />

  <!-- 
    The TF Monogram 
    Shared vertical stroke, T crossbar at top, F middle bar below.
    Stroke width: 4px giving a beautiful 2px border radius on all inner and outer corners.
  -->
  <path d="M 26 26 
           L 102 26 
           L 102 40 
           L 71 40 
           L 71 58 
           L 94 58 
           L 94 72 
           L 71 72 
           L 71 102 
           L 57 102 
           L 57 40 
           L 26 40 
           Z" 
        fill="#FFFFFF" 
        stroke="#FFFFFF" 
        stroke-width="4" 
        stroke-linejoin="round" 
        stroke-linecap="round" 
        filter="url(#subtleShadow)" />
</svg>
